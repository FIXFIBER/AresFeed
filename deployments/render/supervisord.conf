[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --save "" --appendonly no --bind 127.0.0.1
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log

[program:api]
command=/usr/local/bin/api
autostart=true
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log

[program:gateway]
command=/usr/local/bin/gateway
autostart=true
autorestart=true
stdout_logfile=/var/log/gateway.log
stderr_logfile=/var/log/gateway.log

[program:web]
command=node server.js
directory=/app
# Next's standalone server binds to process.env.HOSTNAME. Force 0.0.0.0 so
# Render's health checker (which reaches the container on $PORT) can connect.
environment=HOSTNAME=0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/var/log/web.log
stderr_logfile=/var/log/web.log
